<meta name="apple-mobile-web-app-capable" content="yes">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<title>Healthy Habit Calendar</title>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column (max 520px), three views switched by a bottom tab bar: Today / Calendar / Stats. */
:root{
  --bg:#eef3f0; --surface:#ffffff; --surface-2:#f5f8f6; --line:#d8e2dc;
  --ink:#16211b; --muted:#5d6d64;
  --body:#1e7a58; --body-soft:#dcefe6;
  --mind:#5a54c9; --mind-soft:#e6e4f8;
  --routine:#b7790b; --routine-soft:#f6ecd6;
  --partial:#e3b341; --good:#59b98a; --full:#1e7a58; --track:#e1e8e3;
  --m1:#c96a5a; --m2:#e0a04a; --m3:#b9b55a; --m4:#6fbf8a; --m5:#2e9a6a;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --text:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#172019; --surface-2:#1c2620; --line:#2a3830;
  --ink:#e6eee9; --muted:#9db0a5;
  --body:#5fcf9f; --body-soft:#1f3a2e; --mind:#a19cf3; --mind-soft:#2a2848;
  --routine:#e8b04a; --routine-soft:#3a2f17;
  --partial:#c99a2e; --good:#3f9f72; --full:#5fcf9f; --track:#26322b;
  --m1:#e07a68; --m2:#eab25c; --m3:#cfc96a; --m4:#7fd49c; --m5:#5fcf9f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#172019; --surface-2:#1c2620; --line:#2a3830;
  --ink:#e6eee9; --muted:#9db0a5;
  --body:#5fcf9f; --body-soft:#1f3a2e; --mind:#a19cf3; --mind-soft:#2a2848;
  --routine:#e8b04a; --routine-soft:#3a2f17;
  --partial:#c99a2e; --good:#3f9f72; --full:#5fcf9f; --track:#26322b;
  --m1:#e07a68; --m2:#eab25c; --m3:#cfc96a; --m4:#7fd49c; --m5:#5fcf9f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.5}
.app{max-width:520px;margin:0 auto;padding-block:18px calc(84px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--body);outline-offset:2px}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;min-width:0}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.sync{font-size:12px;color:var(--muted);text-align:center;margin:0}
/* today header */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero h1{font-size:30px;font-weight:700;line-height:1.05}
.hero p{margin:4px 0 0;color:var(--muted)}
.streakpill{background:var(--body-soft);color:var(--body);border-radius:99px;padding:6px 12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.ringbig{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.ringbig .ring{width:84px}
.ringbig b{font-family:var(--display);font-size:24px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.ringbig span{color:var(--muted);font-size:14px}
.ring{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c,var(--track)) calc(var(--p,0)*1%),var(--track) 0)}
.ring i{width:76%;aspect-ratio:1;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}
/* mood */
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
.mood{border:2px solid transparent;background:var(--surface-2);border-radius:14px;padding:8px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.mood svg{width:30px;height:30px}
.mood.sel{border-color:var(--mc);background:var(--surface);color:var(--ink);font-weight:600}
.mood[disabled]{opacity:.5;cursor:not-allowed}
/* habits */
.group{display:flex;flex-direction:column;gap:6px}
.group h3{font-family:var(--text);font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--gc);font-weight:700;margin-bottom:2px}
.habit{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid transparent;cursor:pointer;text-align:left;width:100%}
.habit:hover{border-color:var(--line)}
.habit.done{background:var(--gsoft)}
.habit[disabled]{cursor:not-allowed;opacity:.6}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--gc);display:grid;place-items:center;transition:background .15s}
.done>.chk,.done .chk{background:var(--gc)}
.chk svg{width:14px;height:14px;opacity:0}
.done .chk svg{opacity:1}
.hname{font-weight:600;line-height:1.3}
.hdesc{font-size:13px;color:var(--muted);line-height:1.35}
.habit.done .hname{text-decoration:line-through;text-decoration-color:var(--gc)}
.row{padding:12px;border-radius:12px;background:var(--surface-2);display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px}
.row.done{background:var(--gsoft)}
.steps-in{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.steps-in input{width:130px;font:inherit;font-size:16px;font-variant-numeric:tabular-nums;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.steps-in label{font-size:13px;color:var(--muted)}
.mini{height:6px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:8px}
.mini div{height:100%;background:var(--gc)}
.goal-btn{background:none;border:none;color:var(--body);font-size:13px;cursor:pointer;text-decoration:underline;padding:0}
.goal-edit{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.goal-edit input{width:100px;font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.goal-edit button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer}
.water{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.glass{width:26px;height:32px;border:2px solid var(--gc);border-radius:4px 4px 8px 8px;background:none;cursor:pointer;padding:0}
.glass.full{background:var(--gc)}
.glass[disabled]{cursor:not-allowed}
.futnote{font-size:13px;color:var(--muted);margin:0}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:600}
.daynav h2{font-size:18px}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.calhead h2{font-size:20px}
.nav{display:flex;gap:6px}
.nav button{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:600}
.wk,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wk div{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding-bottom:4px}
.day{aspect-ratio:1;max-width:100%;border:2px solid transparent;background:var(--surface-2);border-radius:12px;cursor:pointer;display:grid;place-items:center;padding:0;position:relative}
.day.blank{background:none;cursor:default}
.day.future{opacity:.45}
.day.sel{border-color:var(--ink)}
.day .ring{width:74%}
.day .ring i{background:var(--surface-2);font-size:clamp(11px,3.2vw,14px)}
.day.today .ring i{color:var(--body)}
.day .md{position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tile b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.chart{overflow-x:auto}
.chart svg{width:100%;min-width:300px;height:auto;display:block}
.hbars{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.hbar .t{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:3px}
.hbar .t div{height:100%;border-radius:99px}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
.insight{background:var(--body-soft);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}
.notes ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.notes li::marker{color:var(--body)}
/* text habits */
.row textarea{width:100%;font:inherit;font-size:15px;line-height:1.45;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical;min-height:64px;margin-top:8px}
.row .chk.tap{cursor:pointer}
.diary{display:flex;flex-direction:column;gap:10px}
.diary .e{padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.diary .e b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.diary .e p{margin:0;white-space:pre-wrap;line-height:1.45}
.diary .e p+b{margin-top:8px}
/* affirmation */
.aff{background:linear-gradient(135deg,var(--mind-soft),var(--body-soft));border:1px solid var(--line)}
.aff p{font-family:var(--display);font-size:20px;line-height:1.3;margin:6px 0 10px;text-wrap:balance}
.aff p.gu{font-family:var(--text);font-size:16px;color:var(--muted);margin:-4px 0 12px;line-height:1.5}
.aff .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.aff .acts .btn{font-size:13px}
.aff form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.aff input{flex:1;min-width:0;font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--body);border-color:var(--body);color:#fff}
.btn.danger{color:var(--m1)}
/* manage habits */
.mg{display:flex;flex-direction:column;gap:14px}
.mg h2{font-size:22px}
.mg .group{gap:4px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.mrow .hname{font-size:14px}
.mrow.off .hname,.mrow.off .hdesc{opacity:.5;text-decoration:line-through}
.mrow .ctl{display:flex;gap:6px;align-items:center}
.sw{width:40px;height:24px;border-radius:99px;background:var(--track);border:none;position:relative;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw.on{background:var(--gc,var(--body))}.sw.on::after{left:19px}
.addf{display:grid;gap:8px}
.addf input,.addf select{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.addf .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
/* account */
.acct{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.acct .who{display:flex;align-items:center;gap:8px;min-width:0}
.acct img{width:28px;height:28px;border-radius:50%}
.acct .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn svg{width:16px;height:16px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tab{background:none;border:none;border-radius:12px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:600}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--body)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <div class="acct" id="acct"></div>
  <section class="view" id="v-today"></section>
  <section class="view" id="v-calendar" hidden>
    <div class="card">
      <div class="calhead"><h2 id="cal-title">Month</h2>
        <div class="nav"><button id="prev" aria-label="Previous month">‹</button><button id="todayBtn">Today</button><button id="next" aria-label="Next month">›</button></div></div>
      <div class="wk"><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div><div>Su</div></div>
      <div class="days" id="days"></div>
      <div class="legend"><span><i style="background:var(--track)"></i>Nothing yet</span><span><i style="background:var(--partial)"></i>A few</span><span><i style="background:var(--good)"></i>More than half</span><span><i style="background:var(--full)"></i>All done</span><span>· small dot = mood</span></div>
    </div>
    <div class="card" id="calday"></div>
    <div class="card" id="diary"></div>
  </section>
  <section class="view" id="v-stats" hidden></section>
  <p class="sync" id="sync">Loading…</p>
</div>
<nav class="tabs" aria-label="Sections"><div>
  <button class="tab on" data-v="today"><svg viewBox="0 0 24 24"><path d="M4 12l2.5-2.5L10 13l7-7 3 3"/><path d="M4 19h16"/></svg>Today</button>
  <button class="tab" data-v="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
  <button class="tab" data-v="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
</div></nav>

<script>
const HABITS=[
  {k:'steps',g:'body',name:'Steps',desc:'Enter how many steps you walked',type:'steps'},
  {k:'water',g:'body',name:'Water (8 glasses)',desc:'Tap a glass each time you drink one',type:'water'},
  {k:'sleep',g:'body',name:'Sleep 7–8 hours',desc:'Better energy, mood and memory'},
  {k:'yoga',g:'body',name:'Yoga / stretching',desc:'15 minutes to keep the body flexible'},
  {k:'fruit',g:'body',name:'Fruit / salad',desc:'Vitamins and fibre for good digestion'},
  {k:'sun',g:'body',name:'Morning sunlight',desc:'10 minutes outside for vitamin D'},
  {k:'nojunk',g:'body',name:'No junk food',desc:'Less fried food and sugar'},
  {k:'home',g:'body',name:'Home-cooked food',desc:'Eat meals made at home, not outside'},
  {k:'read',g:'mind',name:'Book reading',desc:'20 minutes or 10 pages'},
  {k:'affirm',g:'mind',name:'Affirmation',desc:'Write your own positive line for today',type:'text',ph:'Today I am…'},
  {k:'grat',g:'mind',name:'Gratitude writing',desc:'Three things you are grateful for today',type:'text',ph:'1. \n2. \n3. '},
  {k:'medit',g:'mind',name:'Meditation',desc:'5–10 minutes to calm the mind'},
  {k:'screen',g:'mind',name:'Screen break',desc:'No phone 30 minutes before bed'},
  {k:'wake',g:'routine',name:'Wake up early',desc:'Start the day calmly, with more time'}
];
const GROUPS={body:{t:'Body',c:'--body',s:'--body-soft'},mind:{t:'Mind',c:'--mind',s:'--mind-soft'},routine:{t:'Routine',c:'--routine',s:'--routine-soft'}};
const MOODS=[{v:1,l:'Rough',f:'M8 16c1-1.5 2.5-2 4-2s3 .5 4 2'},{v:2,l:'Low',f:'M8.5 15.5c1-.8 2.2-1.2 3.5-1.2s2.5.4 3.5 1.2'},{v:3,l:'Okay',f:'M8.5 15h7'},{v:4,l:'Good',f:'M8.5 14c1 .8 2.2 1.2 3.5 1.2s2.5-.4 3.5-1.2'},{v:5,l:'Great',f:'M8 13.5c1 1.6 2.5 2.3 4 2.3s3-.7 4-2.3'}];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WATER=8;
const AFFS=[
  {en:'I take care of my body and my mind.',gu:'હું મારા શરીર અને મનની સંભાળ રાખું છું.'},
  {en:'Small steps every day add up to big change.',gu:'રોજનાં નાનાં પગલાં મોટા પરિવર્તનમાં બદલાય છે.'},
  {en:'I am proud of how far I have come.',gu:'હું જેટલું આગળ આવી છું તેનો મને ગર્વ છે.'},
  {en:'Today I choose calm over worry.',gu:'આજે હું ચિંતાને બદલે શાંતિ પસંદ કરું છું.'},
  {en:'I deserve rest, water and good food.',gu:'આરામ, પાણી અને સારું ભોજન મારો હક છે.'},
  {en:'I am stronger than my excuses.',gu:'હું મારાં બહાનાં કરતાં વધુ મજબૂત છું.'},
  {en:'My habits shape the person I am becoming.',gu:'મારી ટેવો નક્કી કરે છે કે હું કોણ બની રહી છું.'},
  {en:'I let go of what I cannot control.',gu:'જે મારા હાથમાં નથી તેને હું જવા દઉં છું.'},
  {en:'I am grateful for this day and this body.',gu:'આ દિવસ અને આ શરીર માટે હું આભારી છું.'},
  {en:'Progress, not perfection.',gu:'સંપૂર્ણતા નહીં, પ્રગતિ મહત્વની છે.'},
  {en:'I show up for myself, even on hard days.',gu:'મુશ્કેલ દિવસે પણ હું મારા માટે હાજર રહું છું.'},

function streak(){

}
function longestStreak(){
  const ks=Object.keys(days).filter(k=>k<=TODAY).sort();if(!ks.length)return 0;
  let best=0,cur=0,k=ks[0],m=streakMin();

  return best;
}

  el.querySelectorAll('button.day').forEach(b=>b.onclick=()=>{selected=b.dataset.k;editingGoal=false;render()});
  const cd=document.getElementById('calday'), dt=parse(selected), c=countDone(selected);
  cd.innerHTML=`<div class="daynav" style="margin-bottom:10px"><h2>${WD[dt.getDay()]}, ${dt.getDate()} ${MONTHS[dt.getMonth()]}</h2><span class="streakpill">${c}/${TOTAL}</span></div>${moodHTML(selected).replace('class="card"','class=""')}<div style="height:10px"></div>${habitListHTML(selected).replace(/class="group card"/g,'class="group"').replace(/<\/div><div class="group"/g,'</div><div style="height:12px"></div><div class="group"')}`;
  wireList(cd);
  const n2=new Date(viewY,viewM+1,0).getDate();let dh='';
  for(let d2=n2;d2>=1;d2--){const k2=key(viewY,viewM,d2),t=dayData(k2).text||{};const g=(t.grat||'').trim(),a=(t.affirm||'').trim();if(!g&&!a)continue;
    dh+=`<div class="e"><b>${d2} ${MONTHS[viewM]}</b>${a?`<p class="aff-line"></p>`:''}${g?`<b>Grateful for</b><p class="grat-line"></p>`:''}</div>`;}
  const dv=document.getElementById('diary');
  dv.innerHTML=`<div class="eyebrow" style="margin-bottom:10px">Diary · ${MONTHS[viewM]}</div>`+(dh?`<div class="diary">${dh}</div>`:'<p class="hdesc">Nothing written this month yet. Open a day and write your gratitude or affirmation.</p>');
  let i2=0;const es=dv.querySelectorAll('.e');
  for(let d2=n2;d2>=1;d2--){const k2=key(viewY,viewM,d2),t=dayData(k2).text||{};const g=(t.grat||'').trim(),a=(t.affirm||'').trim();if(!g&&!a)continue;const el=es[i2++];if(a)el.querySelector('.aff-line').textContent='“'+a+'”';if(g)el.querySelector('.grat-line').textContent=g}
}
function renderStats(){
  const root=document.getElementById('v-stats');
  const TOTAL=total(), STREAK_MIN=streakMin(), HL=activeHabits();
  const last30=lastN(30,TODAY), logged=last30.filter(k=>days[k]);
  const compl=last30.reduce((a,k)=>a+countDone(k),0)/(30*TOTAL)*100;
  const good=last30.filter(k=>countDone(k)>=STREAK_MIN).length;
  const perfect=last30.filter(k=>countDone(k)===TOTAL).length;
  // per-habit %
  const per=HL.map(h=>({h,p:last30.filter(k=>isDone(dayData(k),h)).length/30*100})).sort((a,b)=>b.p-a.p);
  // mood graph, last 14 days
  const m14=lastN(14,TODAY), W=640,H=200,L=34,B=28,T=16;
  const x=i=>L+i*((W-L-12)/13), y=v=>T+(H-T-B)*(1-(v-1)/4);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mood over the last 14 days">`;
  for(let v=1;v<=5;v++)svg+=`<line x1="${L}" x2="${W-12}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${MOODS[v-1].l}</text>`;
  const pts=m14.map((k,i)=>({k,i,m:dayData(k).mood})).filter(p=>p.m);
  if(pts.length>1)svg+=`<path d="${pts.map((p,j)=>(j?'L':'M')+x(p.i)+' '+y(p.m)).join(' ')}" fill="none" stroke="var(--body)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach(p=>svg+=`<circle cx="${x(p.i)}" cy="${y(p.m)}" r="5" fill="var(--m${p.m})" stroke="var(--surface)" stroke-width="2"/>`);
  m14.forEach((k,i)=>{if(i%2===0||i===13)svg+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${parse(k).getDate()}</text>`});
  svg+='</svg>';
  // insight: mood vs habits
  const withMood=Object.keys(days).filter(k=>k<=TODAY&&days[k].mood);
  const hi=withMood.filter(k=>days[k].mood>=4), lo=withMood.filter(k=>days[k].mood<=2);
  const avg=a=>a.length?(a.reduce((s,k)=>s+countDone(k),0)/a.length).toFixed(1):null;
  let ins;
  if(hi.length&&lo.length)ins=`On days you felt <b>good or great</b> you completed <b>${avg(hi)}</b> habits on average, versus <b>${avg(lo)}</b> on low days.`;
  else if(withMood.length<3)ins='Log your mood for a few days and this will show how your habits and mood connect.';
  else ins=`On the ${withMood.length} days with a mood logged you completed <b>${avg(withMood)}</b> habits on average.`;
  // best habit pair
  const best=per[0], worst=per[per.length-1];
  // steps week
  const wk=lastN(7,TODAY), steps=wk.map(k=>dayData(k).steps||0), wtotal=steps.reduce((a,b)=>a+b,0);
  root.innerHTML=`
    <h1 style="font-size:28px">Stats</h1>
    <div class="tiles">
      <div class="tile"><b>${streak()}</b><span>Current streak</span></div>
      <div class="tile"><b>${longestStreak()}</b><span>Longest streak</span></div>
      <div class="tile"><b>${Math.round(compl)}%</b><span>Completion, last 30 days</span></div>
      <div class="tile"><b>${good}</b><span>Good days (${STREAK_MIN}+), last 30</span></div>
      <div class="tile"><b>${perfect}</b><span>Perfect days, last 30</span></div>
      <div class="tile"><b>${fmt(wtotal)}</b><span>Steps, last 7 days</span></div>
    </div>
    <div class="card"><div class="eyebrow">Mood, last 14 days</div><div class="chart" style="margin-top:8px">${svg}</div><div class="insight" style="margin-top:12px">${ins}</div></div>
    <div class="card"><div class="eyebrow">Habits, last 30 days</div>
      ${logged.length?`<p style="margin:8px 0 0;font-size:14px;color:var(--muted)">Strongest: <b style="color:var(--ink)">${esc(best.h.name)}</b>. Needs attention: <b style="color:var(--ink)">${esc(worst.h.name)}</b>.</p>`:'<p style="margin:8px 0 0;font-size:14px;color:var(--muted)">Nothing logged yet. Tick a few habits on the Today tab.</p>'}
      <div class="hbars">${per.map(({h,p})=>`<div class="hbar"><div><div>${esc(h.name)}</div><div class="t"><div style="width:${p}%;background:var(${GROUPS[h.g].c})"></div></div></div><b>${Math.round(p)}%</b></div>`).join('')}</div></div>
    <div class="card notes"><div class="eyebrow" style="margin-bottom:8px">Notes</div><ul>
      <li>Don't worry if you can't do every habit in one day. Finishing at least <b>half</b> of them each day is good progress.</li>
      <li>Start with 4–5 habits, then add more slowly. Use <b>Edit habits</b> on the Today tab to hide ones you don't need or add your own.</li>
      <li>Write your gratitude and affirmation right in the app, or in your notebook and just tick the box. The Calendar tab keeps a diary of everything you write.</li>
      <li>A day counts toward your streak when at least half of your habits (${STREAK_MIN} of ${TOTAL}) are done. If the streak breaks, simply start again the next day. Consistent beats perfect.</li>
      <li>Change the steps goal to suit your body. If you have any medical condition, check with your doctor.</li></ul></div>`;
}
function renderLight(){
  const TOTAL=total();
  const d=dayData(selected), c=countDone(selected), pct=Math.min(100,(d.steps||0)/settings.stepsGoal*100);
  document.querySelectorAll('#steps-bar').forEach(e=>e.style.width=pct+'%');
  document.querySelectorAll('#steps-lbl').forEach(e=>e.textContent=Math.round(pct)+'% of goal');
  document.querySelectorAll('#steps-row').forEach(e=>e.classList.toggle('done',pct>=100));
  activeHabits().filter(h=>h.type==='text').forEach(h=>document.querySelectorAll('#row-'+h.k).forEach(e=>e.classList.toggle('done',isDone(d,h))));
  const sp=document.querySelector('#v-calendar .streakpill');if(sp&&view==='calendar')sp.textContent=`${c}/${TOTAL}`;
  const dc=document.getElementById('dcount');if(dc)dc.textContent=`${c}/${TOTAL}`;
}
function render(){
  const a=document.activeElement;
  if(a&&(a.id==='steps-in'||a.matches&&a.matches('textarea[data-t]'))){renderLight();return}
  if(view==='today')renderToday();
  else if(view==='calendar')renderCalendar();
  else renderStats();
}
function showView(v){
  view=v;
  ['today','calendar','stats'].forEach(n=>document.getElementById('v-'+n).hidden=n!==v);
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  if(v==='calendar'){const dt=parse(selected);viewY=dt.getFullYear();viewM=dt.getMonth()}
  editingGoal=false;managing=false;render();window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>showView(t.dataset.v));
document.getElementById('prev').onclick=()=>{viewM--;if(viewM<0){viewM=11;viewY--}render()};
document.getElementById('next').onclick=()=>{viewM++;if(viewM>11){viewM=0;viewY++}render()};
document.getElementById('todayBtn').onclick=()=>{viewY=now.getFullYear();viewM=now.getMonth();selected=TODAY;render()};
initStore();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
